<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Permanentky — kontrola u vstupu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="stav">
  <div class="stav-radek">
    <span id="sit" class="odznak">…</span>
    <span id="fronta" class="odznak" hidden></span>
    <span id="stari" class="odznak jemny">seznam nestažen</span>
    <button id="btn-nastaveni" class="ikona" title="Správa" aria-label="Správa">⚙</button>
  </div>
  <div class="stav-radek">
    <select id="zapas" aria-label="Zápas">
      <option value="">— vyber zápas —</option>
    </select>
    <span id="pocitadlo" class="odznak jemny"></span>
  </div>
</header>

<main id="kamera">
  <video id="video" muted playsinline></video>
  <div class="hledacek"><div class="ramecek"></div></div>
  <p id="hlaska" class="hlaska">Namiř kameru na QR kód permanentky.</p>
  <button id="btn-kamera" class="velke-tlacitko">Spustit kameru</button>
</main>

<form id="rucni" class="rucni">
  <input id="rucni-kod" inputmode="text" autocapitalize="characters" autocomplete="off"
         spellcheck="false" placeholder="RCE-2026-0001-K7X4" aria-label="Kód permanentky">
  <button type="submit">Ověřit</button>
</form>

<!-- Verdikt překryje celou obrazovku, ať je vidět i proti světlu. -->
<section id="verdikt" class="verdikt" hidden aria-live="assertive">
  <div class="verdikt-obsah">
    <p id="v-nadpis" class="v-nadpis"></p>
    <p id="v-jmeno" class="v-jmeno"></p>
    <p id="v-typ" class="v-typ"></p>
    <p id="v-duvod" class="v-duvod"></p>
    <dl id="v-detaily" class="v-detaily"></dl>
    <p id="v-kod" class="v-kod"></p>
    <p id="v-poznamka" class="v-poznamka"></p>
  </div>
  <div class="verdikt-tlacitka">
    <button id="v-pustit" class="tl-druhotne" hidden>Přesto pustit</button>
    <button id="v-dalsi" class="tl-hlavni">Další</button>
  </div>
</section>

<!-- Správa: připojení, zápasy, permanentky, typy, statistiky. Obsah staví sprava.js. -->
<section id="sprava" class="panel" hidden>
  <div class="s-hlavicka">
    <div id="s-zalozky" class="s-zalozky"></div>
    <button id="s-zavrit" class="ikona" title="Zavřít" aria-label="Zavřít">✕</button>
  </div>
  <p id="s-hlaska" class="n-hlaska"></p>
  <div id="s-obsah" class="s-obsah"></div>
</section>

<!-- Karty k tisku. Na obrazovce skryté, při tisku jediné, co je vidět. -->
<div id="tisk" class="tisk" aria-hidden="true"></div>

<script src="lib/jsQR.js"></script>
<script src="lib/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
